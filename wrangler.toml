name = "alejandra-app-api"
main = "worker.js"
compatibility_date = "2025-01-01"
preview_urls = false
account_id = "d65ead2b2967bf68ff3848a36cd7b1b4"

[[d1_databases]]
binding = "DB"
database_name = "alejandra-db"
database_id = "0c9eccde-78f1-476d-ac68-bf452bec0c62"

[[r2_buckets]]
binding = "FILES"
bucket_name = "alejandra-app-files"

# ADR-0014 §4 — versión derivada (no escrita a mano) para GET /health. Cloudflare rellena
# este binding en cada deploy con el mismo identificador que aparece en
# `wrangler deployments list`, sin que el pipeline de CI tenga que inyectar nada aparte.
[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
crons = ["0 7 * * *", "0 18 * * *"]
