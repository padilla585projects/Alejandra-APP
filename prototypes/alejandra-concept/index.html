<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alejandra</title><link rel="stylesheet" href="styles.css"><body><a class="skip" href="#main">Saltar al contenido</a><div class="app"><aside class="app-sidebar"><b class="brand">Alejandra</b><nav><button class="active" data-view="control">Inicio</button><button data-view="work">Trabajo</button><span class="nav-group">OPERACIÓN</span><button data-view="dashboard">Panorama</button><button data-view="checklists">Checklists</button><button data-view="plans">Planos</button><button data-view="calendar">Calendario</button><span class="nav-group">CONOCIMIENTO</span><button data-view="memory">Memoria</button><button data-view="nexo">Nexo</button><button data-view="tools">Herramientas</button></nav><button data-view="settings">Configuración</button></aside><div class="workspace"><header class="topbar"><div class="scope"><label>Empresa<select id="company"><option value="norte">Norte Construcción</option><option value="atlas">Atlas Servicios</option></select></label><label>Obra<select id="project"></select></label><label>Departamento<select id="department"></select></label></div><div class="header-actions"><span class="sync" id="syncStatus"><span id="syncIcon" aria-hidden="true"></span><span id="syncText">Sincronizado</span></span><button class="icon" id="offline">Offline</button><button class="icon" id="theme">Tema</button></div></header><p class="scope-note" id="scopeNote"></p><main id="main"><section class="view active" id="control"><h1>¿Qué necesita atención ahora?</h1><div id="attention"></div></section><section class="view" id="work"><h1>Trabajo</h1><div class="grid two" id="workInbox"></div></section><section class="view" id="incidents"><h1>Incidencias</h1><table><tbody id="rows"></tbody></table><aside class="detail-panel" id="detail"></aside></section><section class="view" id="dashboard"><h1>Panorama</h1><p id="panoramaText"></p><p id="panoramaMetrics"></p><button data-state="loading">Carga</button><button data-state="empty">Vacío</button><button data-state="error">Error</button><div id="state" hidden></div></section><section class="view" id="checklists"><h1>Checklists</h1><p id="checklistText"></p></section><section class="view" id="plans"><h1>Planos</h1><div class="plan"><div id="planMarks"></div><aside class="detail-panel" id="planDetail">Selecciona una marca.</aside></div></section><section class="view" id="calendar"><h1>Calendario</h1><div id="calendarItems"></div></section><section class="view" id="chat"><h1>Alejandra</h1><h2 id="chatTitle"></h2><p id="chatText"></p></section><section class="view" id="memory"><h1>Memoria</h1><p id="memoryText"></p></section><section class="view" id="nexo"><h1>Nexo</h1><p id="nexoText"></p></section><section class="view" id="tools"><h1>Herramientas</h1></section><section class="view" id="notifications"><h1>Notificaciones</h1><button id="snooze">Posponer 1 h</button></section><section class="view" id="settings"><h1>Configuración</h1></section></main><nav class="mobile"><button class="active" data-view="control">Inicio</button><button data-view="work">Trabajo</button><button id="scan">Escanear</button><button data-view="chat">Alejandra</button></nav></div></div><div id="toast"></div><script src="demo.js"></script></body></html>
