name: Publish Nucleo Cognitivo packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_NUCLEO_COGNITIVO to confirm npm publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirmation == 'PUBLISH_NUCLEO_COGNITIVO'
    name: Publish @alejandra/cognitive-core and @alejandra/cognitive-core-policy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Check package syntax
        run: |
          node --check nucleo-cognitivo/packages/cognitive-core/lib.js
          node --check nucleo-cognitivo/packages/cognitive-core-policy/lib.js
      - name: Verify modules exposed by lib.js
        run: |
          cd nucleo-cognitivo/packages/cognitive-core && bash verify_nucleo.sh
          cd ../cognitive-core-policy && bash verify_nucleo.sh
      - name: Run package tests
        run: |
          cd nucleo-cognitivo/packages/cognitive-core && npm test
          cd ../../cognitive-core-policy && npm test
      - name: Publish @alejandra/cognitive-core
        working-directory: nucleo-cognitivo/packages/cognitive-core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @alejandra/cognitive-core-policy
        working-directory: nucleo-cognitivo/packages/cognitive-core-policy
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}