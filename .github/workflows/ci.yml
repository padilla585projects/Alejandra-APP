name: CI validation

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  android-ar:
    name: Android AR compilation and surface tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native dependencies
        working-directory: capacitor
        run: npm ci
      - name: Prepare Capacitor Android plugins
        working-directory: capacitor
        run: npx cap update android
      - name: Compile Android and test surface placement
        working-directory: capacitor/android
        run: bash gradlew testDebugUnitTest --console=plain

  validate:
    name: Syntax and agent tests
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 es necesario para el check de encoding, que compara contra la
      # base y no contra ficheros enteros.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: |
          node --check worker.js
          node --check alejandra-agente/worker.js
      # F-0.2: validaciones que CLAUDE.md describe como manuales. Existían, pero había que
      # acordarse de ejecutarlas — y el incidente de encoding del 13/05/2026 costó horas.
      - name: Check file encoding (added lines only)
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          node scripts/check-encoding.js "$BASE"
      - name: Check version markers are in sync
        run: node scripts/check-versiones.js
      # DEPT-CONTROL-01: un departamento en el frontend que el Worker no acepta deja la
      # sesion de D1 con el anterior y el servidor decide con otro departamento.
      - name: Check departments match between Worker and frontends
        run: node scripts/check-departamentos.js
      - name: Check every route declares an authorization mechanism
        run: node scripts/inventario-rutas.js --check
      # Solo compara NOMBRES: nunca lee valores de secretos ni contacta con Cloudflare.
      - name: Check secrets and bindings are declared
        run: node scripts/inventario-entorno.js --check
      - name: Install agent test dependencies
        working-directory: alejandra-agente
        run: npm ci
      - name: Install Worker validation dependencies
        run: npm ci --ignore-scripts
      - name: Run agent tests
        working-directory: alejandra-agente
        run: npm test
      - name: Check AI benchmark measurement and error handling
        run: node --test scripts/ai-benchmark/run.test.mjs
      # ADR-0028: arnés de comparación del pool propio (fetch simulado, sin llamadas reales).
      - name: Check own AI pool benchmark harness
        run: node --test scripts/ai-benchmark/pool.test.mjs
      # ADR-0028 §Medición: banco de casos de Alejandra (esquema, tools reales del agente,
      # anonimización y evaluador). Sin llamadas a ningún modelo.
      - name: Check Alejandra case bank for the AI pool
        run: node --test scripts/ai-benchmark/banco-alejandra.test.mjs
      - name: Check technical tools and Office plan failures
        run: node --test scripts/technical-tools.test.cjs
      - name: Check shift calendars and weekly rotation
        run: node --test scripts/cuadrantes-turnos.test.cjs
      - name: Check native Android AR overlay
        run: node --test scripts/android-ar-overlay.test.cjs
      - name: Check Android/PWA back button hierarchy
        run: node --test scripts/android-atras.test.cjs
      # ADR-0027: escaneo del entorno + IA (geometría compartida, límites de coste en el
      # servidor con R2 simulado y aislamiento por empresa/departamento).
      - name: Check AR environment scan and vision AI limits
        run: node --test scripts/replanteo-escaneo.test.cjs
      # Prioridades 2-4 del trazado realista: ángulo recto con normales reales, líneas en
      # paralelo (también el material del servidor), superficie forzada y edición de puntos.
      - name: Check AR route geometry (right angles, parallel runs, forced surface)
        run: node --test scripts/replanteo-trazado.test.cjs
      # El pegamento real del AR WebXR de index.html (giro de pantalla, superficie forzada,
      # edición de cualquier punto, paralelas, sesión cerrada sola) con un DOM mínimo.
      - name: Check PWA AR flow glue (rotation, forced surface, point editing)
        run: node --test scripts/replanteo-ar-flujo.test.cjs
      # F-1.2/F-1.3: nucleo-cognitivo v2 dividido en dos subcarpetas.
      - name: Check nucleo-cognitivo syntax
        run: |
          for f in nucleo-cognitivo/packages/cognitive-core/src/*.js \
                   nucleo-cognitivo/packages/cognitive-core/test/*.js \
                   nucleo-cognitivo/packages/cognitive-core-policy/src/*.js \
                   nucleo-cognitivo/packages/cognitive-core-policy/test/*.js; do
            node --check "$f"
          done
      - name: Run nucleo-cognitivo tests
        run: |
          cd nucleo-cognitivo/packages/cognitive-core && node --test test/contratos.test.js test/memory.test.js test/tool-registry-verifier.test.js
          cd ../cognitive-core-policy && node --test test/policy.test.js
