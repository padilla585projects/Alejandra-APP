name: Deploy API Worker (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch approved for deployment
        required: true
        default: main
      confirmation:
        description: Type DEPLOY_API_WORKER to confirm production deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'DEPLOY_API_WORKER'
    name: Deploy API Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # INFORMES-SEG-SEMANAL-01 (13/08/2026): worker.js pasó a depender de un paquete
      # npm real (docx, generación del informe semanal de Seguridad) -- wrangler
      # necesita node_modules presente para poder empaquetarlo antes de desplegar.
      - name: Install dependencies
        run: npm ci
      # Precheck exigido por ADR-0001: no se despliega codigo que no parsea.
      - name: Precheck Worker syntax
        run: node --check worker.js
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
      # Healthcheck automatico (ADR-0014): /health ya comprueba D1 y R2 y distingue
      # desplegado de operativo. "degraded" es advertencia, no bloquea; "unhealthy"
      # bloquea el job. No sustituye la verificacion manual registrada en
      # docs/runbooks/CI-CD-Y-MIGRACIONES.md.
      - name: Verify deployment health
        run: |
          set -e
          URL="https://alejandra-app-api.alejandra-app.workers.dev/health"
          RESPONSE=""
          for i in 1 2 3 4 5; do
            if RESPONSE=$(curl -sf "$URL"); then
              break
            fi
            echo "Intento $i sin respuesta, reintentando en 5s..."
            sleep 5
          done
          if [ -z "$RESPONSE" ]; then
            echo "::error::/health no respondio tras 5 intentos."
            exit 1
          fi
          echo "$RESPONSE"
          ESTADO=$(echo "$RESPONSE" | jq -r '.estado // "desconocido"')
          if [ "$ESTADO" = "unhealthy" ]; then
            echo "::error::/health devolvio unhealthy. Revisar D1/R2 antes de dar por bueno el despliegue."
            exit 1
          elif [ "$ESTADO" = "degraded" ]; then
            echo "::warning::/health devolvio degraded. Investigar antes de dar por bueno el despliegue."
          elif [ "$ESTADO" != "healthy" ]; then
            echo "::warning::/health devolvio un estado inesperado: $ESTADO."
          else
            echo "Estado healthy."
          fi
