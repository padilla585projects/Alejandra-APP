name: Deploy API Worker (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch approved for deployment
        required: true
        default: main
      confirmation:
        description: Type DEPLOY_API_WORKER to confirm production deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'DEPLOY_API_WORKER'
    name: Deploy API Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Precheck exigido por ADR-0001: no se despliega codigo que no parsea.
      - name: Precheck Worker syntax
        run: node --check worker.js
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
      # SIN healthcheck automatico a proposito. GET /health de este Worker devuelve
      # {ok:true} constante sin tocar D1 ni R2 (worker.js:4822): responderia 200 con
      # la base de datos caida o los bindings ausentes, dando por bueno un despliegue
      # roto. Verificacion manual post-despliegue segun
      # docs/runbooks/CI-CD-Y-MIGRACIONES.md.
      # Reincorporar cuando exista un endpoint de salud con dependencias reales.
