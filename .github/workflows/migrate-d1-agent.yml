name: Apply Alejandra Agent D1 migration (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch containing the reviewed migration
        required: true
        default: main
      # migrate_008 vuelve al selector tras la fase 2 de ARC-011 (2026-08-02): se
      # bloqueo suponiendo que worker.js:24646 ya habia creado planos.circuitos_json,
      # pero la consulta al esquema real demostro que la columna NO EXISTE. El ALTER
      # en runtime falla en silencio por su .catch(() => {}), y el codigo que usa esa
      # columna esta roto en produccion. Aplicar la 008 es el arreglo, no el riesgo.
      # Ver docs/architecture/07-INVENTARIO-DDL-RUNTIME.md.
      migration:
        description: Reviewed Alejandra Agent migration to apply
        required: true
        type: choice
        options:
          - migrate_001_init_schema.sql
          - migrate_002_token_uso.sql
          - migrate_003_fix_schema.sql
          - migrate_004_rename_agente_config.sql
          - migrate_005_dev_bypass.sql
          - migrate_006_planos_unifilar_planta_electrica.sql
          - migrate_007_planos_planta_industrial.sql
          - migrate_008_plano_circuitos.sql
      confirmation:
        description: Type APPLY_D1_MIGRATION to confirm this remote D1 action
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: github.event.inputs.confirmation == 'APPLY_D1_MIGRATION'
    name: Apply reviewed D1 migration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Punto de extension para bloquear migraciones concretas. Vacio a proposito:
      # el bloqueo de la 008 se retiro tras verificar el esquema real (ARC-011 fase 2).
      # Anadir aqui un caso solo con evidencia del esquema, nunca por suposicion.
      - name: Reject blocked migrations
        env:
          MIGRATION_FILE: ${{ inputs.migration }}
        run: |
          case "$MIGRATION_FILE" in
            __ninguna_bloqueada__)
              echo "::error::Migracion bloqueada."
              exit 1
              ;;
          esac
          echo "Migracion permitida: $MIGRATION_FILE"
      - name: Apply selected migration
        working-directory: alejandra-agente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIGRATION_FILE: ${{ inputs.migration }}
        run: npx wrangler d1 execute alejandra-db --remote --file "$MIGRATION_FILE"
