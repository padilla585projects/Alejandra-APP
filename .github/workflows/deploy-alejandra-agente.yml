name: Deploy Alejandra Agent Worker (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch approved for deployment
        required: true
        default: main
      confirmation:
        description: Type DEPLOY_ALEJANDRA_AGENT to confirm production deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'DEPLOY_ALEJANDRA_AGENT'
    name: Deploy Alejandra Agent Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: alejandra-agente
        run: npm ci
      - name: Run agent tests
        working-directory: alejandra-agente
        run: npm test
      - name: Deploy agent Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: alejandra-agente
      # SIN healthcheck automatico a proposito. GET /health de este Worker responde
      # 200 sin comprobar D1 ni R2, y su campo "version" esta escrito a mano
      # (alejandra-agente/worker.js:2493), asi que no distingue "Worker desplegado"
      # de "Worker operativo" y daria luz verde a un despliegue roto. Verificacion
      # manual post-despliegue segun docs/runbooks/CI-CD-Y-MIGRACIONES.md.
      # Reincorporar cuando exista un endpoint de salud con dependencias reales.
