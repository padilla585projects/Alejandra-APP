name: Configure Cloudflare secrets (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONFIGURE_AGENT_SECRETS to confirm this production action
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    if: github.event.inputs.confirmation == 'CONFIGURE_AGENT_SECRETS'
    name: Configure approved Alejandra Agent secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure approved secrets
        working-directory: alejandra-agente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          node -e 'const keys = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "ADMIN_TOKEN"]; const values = Object.fromEntries(keys.map((key) => [key, process.env[key]])); if (Object.values(values).some((value) => !value)) { throw new Error("Missing approved secret input"); } process.stdout.write(JSON.stringify(values));' | npx wrangler secret bulk --name alejandra-agente
      - name: Result
        run: echo "Approved secrets configured for alejandra-agente"
