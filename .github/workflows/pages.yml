name: Publish GitHub Pages (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch approved for publication
        required: true
        default: main
      confirmation:
        description: Type PUBLISH_GITHUB_PAGES to confirm production publication
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# NOTA (2026-08-06): el bloque de `concurrency` se retiró temporalmente. Un run
# quedó en estado zombie `waiting` (en espera de aprobación de un entorno que,
# con un solo mantenedor, no se puede auto-aprobar — ARC-014) y GitHub no lo
# libera ni cancela (HTTP 502 persistente), dejando bloqueado para siempre el
# grupo `github-pages-production` y colgando todas las publicaciones nuevas en
# `pending`. Con el entorno `github-pages` ya configurado con
# `protected_branches: true` (permite desplegar sin aprobación manual), se
# quita el grupo de concurrency para que una publicación no quede secuestrada
# por un run zombie. GitHub Pages solo admite un deployment activo; si se
# lanzan dos publicaciones casi a la vez, la segunda puede fallar al ocupar el
# deployment activo — se reintenta manualmente hasta, no debe ser el bloqueo
# que nos impida publicar.-in-progress nunca se usó (siempre false).

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'PUBLISH_GITHUB_PAGES'
    # El entorno DEBE llamarse github-pages: actions/deploy-pages@v4 lo exige y
    # falla por permisos con cualquier otro nombre. Las reglas de aprobacion se
    # configuran sobre este entorno, no renombrandolo.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Precheck: las cuatro versiones deben coincidir. Desincronizarlas provoco
      # bucles de recarga infinita en produccion (incidentes 22/04, 26/04 y 09/08/2026 --
      # este ultimo porque PANEL_APP_VERSION en panel.html no estaba en este chequeo).
      - name: Precheck version sync
        run: |
          V_JSON=$(grep -oP '(?<="v":")[^"]+' version.json)
          V_SW=$(grep -oP "(?<=alejandra-v)[\d.]+" sw.js | head -1)
          V_HTML=$(grep -oP "(?<=APP_VERSION = ')[\d.]+" index.html | head -1)
          V_PANEL=$(grep -oP "(?<=PANEL_APP_VERSION = ')[\d.]+" panel.html | head -1)
          echo "version.json=$V_JSON sw.js=$V_SW index.html=$V_HTML panel.html=$V_PANEL"
          if [ "$V_JSON" != "$V_SW" ] || [ "$V_JSON" != "$V_HTML" ] || [ "$V_JSON" != "$V_PANEL" ]; then
            echo "::error::Versiones desincronizadas. No se publica."
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html panel.html admin.html _site/
          for asset in alejandra-panel.html kiosco.html sw.js .nojekyll manifest.json icon-192.png icon-512.png icon.svg favicon.ico; do
            if [ -f "$asset" ]; then cp "$asset" _site/; fi
          done
          for directory in icons fonts img packages; do
            if [ -d "$directory" ]; then cp -r "$directory" _site/; fi
          done
          VERSION=$(grep -oP "(?<=APP_VERSION = ')[\d.]+" index.html | head -1)
          echo "{\"v\":\"$VERSION\"}" > _site/version.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Healthcheck exigido por ADR-0001: la publicacion no se da por buena
      # hasta comprobar que la version servida es la que se acaba de publicar.
      - name: Healthcheck published version
        run: |
          EXPECTED=$(grep -oP "(?<=APP_VERSION = ')[\d.]+" index.html | head -1)
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Esperando propagacion de $URL (esperado v$EXPECTED)"
          for i in 1 2 3 4 5 6; do
            sleep 10
            if BODY=$(curl -fsS "${URL%/}/version.json"); then
              if SERVED=$(printf '%s' "$BODY" | grep -oP '(?<="v":")[^"]+'); then
                :
              else
                SERVED=""
              fi
            else
              SERVED=""
            fi
            echo "Intento $i: servido='$SERVED'"
            if [ "$SERVED" = "$EXPECTED" ]; then
              echo "OK: Pages sirve la version $EXPECTED"
              exit 0
            fi
          done
          echo "::error::Pages no sirve la version $EXPECTED tras 60s. Revisar publicacion."
          exit 1
